name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/create_synthetic_fixture.py
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -m "not slow"
      - run: python -m pytest tests/integration/test_smoke_pipeline.py -m slow

