[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberslm"
version = "0.1.0"
description = "Dataset-ready research infrastructure for a cybersecurity small language model"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pyarrow>=17,<25",
  "PyYAML>=6.0,<7",
  "tokenizers>=0.20,<0.24",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
cyberslm-data = "cyberslm.data.cli:main"
cyberslm-tokenizer = "cyberslm.tokenization.cli:main"
cyberslm-train = "cyberslm.training.cli:main"
cyberslm-generate = "cyberslm.inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["slow: CPU smoke tests that run a tiny training loop"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
packages = ["cyberslm"]
strict = true
warn_unused_ignores = true

